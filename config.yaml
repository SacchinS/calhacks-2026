# Which implementation each component uses. Every default is the mock.
# Flip ONLY your own line while developing; `make mock` ignores these and forces all mocks.
recognizer: mock        # mock | replay | camera        (Person A)
translator: mock        # mock | claude                 (Person B)
claude_code: mock       # mock | real                   (Person B)
siri: mock              # mock | real                   (Person C)
tts: mock               # mock | say | cartesia         (Person C)
captions: mock          # mock | cartesia               (Person C)

# Starting output mode: claude_code | siri | voice | meet
mode: claude_code

ui:
  mirror_camera: true           # show the camera window like a mirror (selfie view)

recognition:
  replay_file: fixtures/landmarks_sample.jsonl
  replay_fps: 30
  replay_classifier: labels     # labels (fixture ground truth) | model (isolated + fingerspelling)
  camera_index: 0
  holistic_model_url: https://storage.googleapis.com/mediapipe-models/holistic_landmarker/holistic_landmarker/float16/latest/holistic_landmarker.task
  holistic_model_path: models/holistic_landmarker.task
  # Signing space in normalized image coords (0..1, y grows downward).
  signing_space: {x_min: 0.1, x_max: 0.9, y_min: 0.05, y_max: 0.8}
  # Segmenter: a sign is emitted after this many consecutive frames above the threshold.
  min_frames: 5
  # YES / NO / FINISH (= SEND) must be held longer, so a mid-sentence FINISH ("already")
  # doesn't send. 0 = twice min_frames.
  control_min_frames: 0
  confidence_threshold: 0.6
  # Kaggle ISLR model (downloaded here on first use): a rolling window of frames, run every
  # `isolated_stride` frames; predictions under `isolated_floor` count as nothing.
  isolated_model_dir: models/islr
  isolated_window: 48
  isolated_min_frames: 12
  isolated_stride: 4
  isolated_floor: 0.3
  isolated_gap_seconds: 0.4      # hands out of the signing space this long: a fresh window
  # Custom signs recorded with tools/record_signs.py (tried before the Kaggle model).
  custom_signs_dir: models/custom_signs
  custom_threshold_scale: 1.0    # lower = stricter matching
  # Facial grammar (brows, head shake / nod) set on each sign as markers. Off until a Deaf
  # signer has checked it: a wrong [negation] flips the meaning.
  face_markers: false
  brow_raise_ratio: 1.15         # brows this much higher than your resting face = raised
  brow_furrow_ratio: 0.92
  head_shake_amplitude: 0.05
  head_nod_amplitude: 0.04

language:
  claude_model: claude-haiku-5-5
  prompt_file: language/prompts/gloss_to_english.md
  max_tokens: 200

claude_code_cli:
  project_dir: ../demo-site      # folder Claude Code edits (make demo-reset copies demo/site there)
  command: claude
  # acceptEdits + only these tools, so a build never stops for an approval (no Bash).
  allowed_tools: Read,Edit,Write,Glob,Grep
  model: ""                      # empty = Claude Code's default model
  timeout_seconds: 900
  use_api_key: false             # true: Claude Code bills .env's ANTHROPIC_API_KEY, not your login

type_to_siri:
  # Siri's keyboard shortcut must be "Hold Command Space", with Type to Siri turned on.
  hold_seconds: 0.8               # how long to hold Cmd-Space to open Siri
  open_delay: 0.4                 # wait after opening before pasting

audio:
  # Our TTS plays into this device; select it as the microphone in dictation / Meet.
  # (Siri can't hear a virtual mic: it gets text through Type to Siri.)
  virtual_mic_device: BlackHole 2ch
  # Meet's audio is captured from a DIFFERENT device, or we'd caption ourselves.
  meet_capture_device: BlackHole 16ch

meet:
  # The call intro ("Hi, this is <name>. I'm Deaf and signing through SignBridge...") is for
  # calls with strangers, where hearing people hang up on relay calls when they don't know
  # who's calling. In team meetings everyone knows you, so it's off unless you press
  # "Introduce me". The app's Settings can set the name.
  signer_name: ""
  app_name: SignBridge
  intro_on_start: false
  # Signing this long unsent: "One moment, I'm signing." Off for meetings, where people can
  # see you signing (0 = off). Useful on audio-only calls.
  signing_cue_seconds: 0
  review_before_speaking: false   # true: Meet and Voice wait for YES / NO, like Claude Code
  # Turn-aware speaking (Cartesia Ink turn detection on the other side's audio): wait for
  # them to finish, or after chime_in_seconds of talking say the interjection and then speak.
  turn_taking: true
  chime_in_seconds: 8
  interjection: "Sorry, can I jump in?"
  yield_seconds: 2.5              # after the interjection, wait this long for them to pause
  barge_in_seconds: 1.0           # talked over this long: stop, and say it again at the pause
  # One-tap replies in the Meet panel, spoken in your voice. Pressing one is the approval
  # (the exact words are on the button). Normal ones wait for a pause like anything else;
  # urgent ones are about how the meeting is going, so they're said right away.
  quick_replies:
    - {text: "Yes."}
    - {text: "No."}
    - {text: "Give me a moment to answer."}
    - {text: "Can you repeat that?", urgent: true}
    - {text: "Please slow down a little.", urgent: true}
    - {text: "One at a time, please.", urgent: true}
    - {text: "Can you type that in the chat?"}
    - {text: "I agree."}

cartesia:
  tts_model: sonic-latest        # or pin one, e.g. sonic-3.5
  stt_model: ink-2
  voice_id: db6b0ed5-d5d3-463d-ae85-518a07d3c2b4   # "Skylar"; any Sonic voice ID (play.cartesia.ai)
  sample_rate: 44100
  # Optional Ink turn-detection tuning, passed to the STT websocket when set:
  # turn_start_threshold, turn_end_threshold, turn_eager_end_threshold, turn_end_timeout_ms

mock_tts:
  seconds_per_word: 0.1           # mock speech takes this long per word (0 = instant)
  say_aloud: false                # true: also speak mock TTS on your speakers with `say`

captions_mock:
  file: fixtures/captions_sample.txt
  interval_seconds: 3.0
  talk_seconds: 1.5               # each mock line is a 1.5 s "turn", so speech waits for it
